<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g transform="rotate(-6 120 130)">
    <!-- Ohren -->
    <circle cx="62" cy="46" r="30" fill="#8D9AA8" />
    <circle cx="62" cy="49" r="16" fill="#FFC1CC" />
    <circle cx="178" cy="46" r="30" fill="#8D9AA8" />
    <circle cx="178" cy="49" r="16" fill="#FFC1CC" />

    <!-- Füße -->
    <ellipse cx="93" cy="223" rx="19" ry="13" fill="#A9B4C0" />
    <ellipse cx="93" cy="226" rx="10" ry="6" fill="#FDF6E9" />
    <ellipse cx="147" cy="223" rx="19" ry="13" fill="#A9B4C0" />
    <ellipse cx="147" cy="226" rx="10" ry="6" fill="#FDF6E9" />

    <!-- Körper -->
    <ellipse cx="120" cy="170" rx="56" ry="52" fill="#A9B4C0" />

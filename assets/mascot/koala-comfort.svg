    <ellipse cx="80" cy="102" rx="12" ry="7" fill="#FFAFC0" opacity="0.6" />
    <ellipse cx="160" cy="102" rx="12" ry="7" fill="#FFAFC0" opacity="0.6" />

    <!-- Augen: sanft, warmherzig -->
